name: Actualizar datos y publicar

on:
  schedule:
    - cron: "30 7 * * *"   # cada día: gasolina del día y, si hay, IPC y salarios nuevos del INE
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Precios de carburantes
        if: github.event_name != 'push'
        run: python scripts/actualizar_carburantes.py --salida site/data
      - name: IPC y salarios del INE
        if: github.event_name != 'push'
        run: python scripts/actualizar_ine.py --salida site/data
      - name: Guardar los datos
        if: github.event_name != 'push'
        run: |
          git config user.name "tu-bolsillo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "data: actualización $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
